[package]
name = "verso-plugin-ddns"
version = "0.1.0"
edition = "2021"

[dependencies]
# The plugin SDK lives in the shell's repository, released with it.
verso-plugin = { git = "https://github.com/we-are-mono/verso", tag = "v0.2.0" }

# The tests assert on the serialized envelope, which is the contract the shell
# decodes; serde_json is the only way to look at it.
[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
